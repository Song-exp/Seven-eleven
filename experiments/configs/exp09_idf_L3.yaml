# exp09 — IDF 가중 + L=3 (인접행렬 3hop 포함)
# 목적: L-sweep — exp08(L=2) vs L=3 성능 비교. parsimony 규칙: L=3이 noise 넘는 마진으로 이겨야 채택
# 변경점: num_layers 2→3 (그 외 exp08과 동일)

graph:
  node_types:
  - product
  - keyword
  - ip
  edge_types:
  - - product
    - has_kw
    - keyword
  - - ip
    - has_kw
    - keyword
  - - keyword
    - trend_to
    - keyword
  - - product
    - has_ip
    - ip
  - - product
    - co_offline
    - product
  - - product
    - co_quick
    - product
  add_reverse_edges: true
  include_offline_copurchase: true
  offline_copurchase_path: data/processed/offline_commerce_edge_lift_pair_out.csv
  include_quick_copurchase: true
  quick_copurchase_path: data/processed/quick_commerce_edge_lift_pair_out.csv
  lift_normalization: log1p
  use_lift_weights: false
  use_idf_keyword_weights: true
  idf_normalization: max
node_feat:
  product_init: content_aggregation
  product_aggr: mean
  use_has_promo_feature: true
  keyword_emb_init: random
  ip_emb_init: random
model:
  hidden_dim: 128
  num_layers: 3
  num_heads: 4
  dropout: 0.3
  use_diffmg_gate: true
  diffmg_temperature: 0.5
label:
  target_col: 성공여부
  positive_value: 성공
  imbalance: weighted_bce
  pos_weight: 3.24
split:
  scheme: stratified
  stratify_by:
  - 편의점명
  - 성공여부
  ratios:
  - 0.7
  - 0.15
  - 0.15
  seed: 42
train:
  optimizer: adam
  lr_w: 0.005
  weight_decay_w: 0.0005
  lr_alpha: 0.02
  weight_decay_alpha: 0.001
  epochs: 200
  early_stopping_patience: 30
  early_stopping_metric: val_pr_auc
  device: auto
eval:
  primary_metric: pr_auc
  metrics:
  - pr_auc
  - auc_roc
  - f1
recommend:
  score_fn: hybrid_alpha_success
  meta_path:
  - keyword
  - product
  - keyword
  top_k: 20
  beam_width: 50
