# exp02 — DiffMG α 튜닝
# 문제: exp01에서 α_r 균등(≈1/8) → 관계 게이팅 미분화 상태.
# 조치: lr_alpha 4배 인상 (0.005→0.02) + temperature 하향 (1.0→0.5) → softmax 집중도 증가.
# 변경 키: train.lr_alpha, model.diffmg_temperature
# 결과: experiments/results/exp02_alpha_tuning/

graph:
  node_types: [product, keyword, ip]
  edge_types:
    - [product, has_kw, keyword]
    - [ip, has_kw, keyword]
    - [keyword, trend_to, keyword]
    - [product, has_ip, ip]
  add_reverse_edges: true
  include_complement_edges: false

node_feat:
  product_init: content_aggregation
  product_aggr: mean
  use_has_promo_feature: true
  keyword_emb_init: random
  ip_emb_init: random

model:
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.3
  use_diffmg_gate: true
  diffmg_temperature: 0.5   # ← 변경: 1.0 → 0.5 (softmax 집중도 상승)

label:
  target_col: 성공여부
  positive_value: 성공
  imbalance: weighted_bce
  pos_weight: 3.24

split:
  scheme: stratified
  stratify_by: [편의점명, 성공여부]
  ratios: [0.70, 0.15, 0.15]
  seed: 42

train:
  optimizer: adam
  lr_w: 0.005
  weight_decay_w: 0.0005
  lr_alpha: 0.02            # ← 변경: 0.005 → 0.02 (α 빠른 분화)
  weight_decay_alpha: 0.001
  epochs: 200
  early_stopping_patience: 30
  early_stopping_metric: val_pr_auc
  device: auto

eval:
  primary_metric: pr_auc
  metrics: [pr_auc, auc_roc, f1]

recommend:
  score_fn: hybrid_alpha_success
  meta_path: [keyword, product, keyword]
  top_k: 20
  beam_width: 50
