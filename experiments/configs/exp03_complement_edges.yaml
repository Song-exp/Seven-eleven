# exp03 — 보완재 엣지 Ablation
# 목적: complement_lift_pairs.csv (968쌍, Lift≥3.0) 의 product-product 엣지 추가가
#        NPD 성공 예측 및 키워드 추천에 기여하는지 검증.
# exp02 세팅(α튜닝) 위에 보완재 엣지만 추가하여 증분 효과 측정.
# 변경 키: graph.include_complement_edges, graph.edge_types (+ complement)
# 결과: experiments/results/exp03_complement_edges/

graph:
  node_types: [product, keyword, ip]
  edge_types:
    - [product, has_kw, keyword]
    - [ip, has_kw, keyword]
    - [keyword, trend_to, keyword]
    - [product, has_ip, ip]
    - [product, complement, product]   # ← 추가: 동반구매 보완재 쌍
  add_reverse_edges: true
  include_complement_edges: true       # ← 변경: false → true

node_feat:
  product_init: content_aggregation
  product_aggr: mean
  use_has_promo_feature: true
  keyword_emb_init: random
  ip_emb_init: random

model:
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.3
  use_diffmg_gate: true
  diffmg_temperature: 0.5   # exp02와 동일 (α튜닝 유지)

label:
  target_col: 성공여부
  positive_value: 성공
  imbalance: weighted_bce
  pos_weight: 3.24

split:
  scheme: stratified
  stratify_by: [편의점명, 성공여부]
  ratios: [0.70, 0.15, 0.15]
  seed: 42

train:
  optimizer: adam
  lr_w: 0.005
  weight_decay_w: 0.0005
  lr_alpha: 0.02            # exp02와 동일 (α튜닝 유지)
  weight_decay_alpha: 0.001
  epochs: 200
  early_stopping_patience: 30
  early_stopping_metric: val_pr_auc
  device: auto

eval:
  primary_metric: pr_auc
  metrics: [pr_auc, auc_roc, f1]

recommend:
  score_fn: hybrid_alpha_success
  meta_path: [keyword, product, keyword]
  top_k: 20
  beam_width: 50
