# exp10_timeslot_node_feat — 시간대 판매 비중을 노드 피처로 추가
# product_nodes에 ts_*_ratio 5개 컬럼(아침/점심/간식/저녁/야식 판매 비중) 추가
# 비교 기준: exp01(피처 없음) / exp09(오프라인 엣지) / exp_ts_*(오프라인 시간대 엣지)
# 엣지는 변경 없음 — 피처만 추가했을 때의 순효과 측정

eval:
  metrics:
  - pr_auc
  - auc_roc
  - f1
  primary_metric: pr_auc
graph:
  add_reverse_edges: true
  edge_types:
  - - product
    - has_kw
    - keyword
  - - ip
    - has_kw
    - keyword
  - - keyword
    - trend_to
    - keyword
  - - product
    - has_ip
    - ip
  include_complement_edges: false
  node_types:
  - product
  - keyword
  - ip
label:
  imbalance: weighted_bce
  pos_weight: 3.24
  positive_value: 성공
  target_col: 성공여부
model:
  diffmg_temperature: 1.0
  dropout: 0.3
  hidden_dim: 128
  num_heads: 4
  num_layers: 2
  use_diffmg_gate: true
node_feat:
  ip_emb_init: random
  keyword_emb_init: random
  product_aggr: mean
  product_init: content_aggregation
  use_has_promo_feature: true
  use_timeslot_features: true
recommend:
  beam_width: 50
  meta_path:
  - keyword
  - product
  - keyword
  score_fn: hybrid_alpha_success
  top_k: 20
split:
  ratios:
  - 0.7
  - 0.15
  - 0.15
  scheme: stratified
  seed: 42
  stratify_by:
  - 편의점명
  - 성공여부
train:
  device: auto
  early_stopping_metric: val_pr_auc
  early_stopping_patience: 30
  epochs: 200
  lr_alpha: 0.005
  lr_w: 0.005
  optimizer: adam
  weight_decay_alpha: 0.001
  weight_decay_w: 0.0005
